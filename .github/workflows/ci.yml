name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一 PR 有新推送时取消旧的 workflow run，避免浪费时间
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Upgrade npm to v11 (match lockfile semantics with dev workstation)
        run: npm install -g npm@11
        # 说明：npm@latest 已切到 npm 12，但 npm 12 requires Node ^22.22 || ^24.15 || >=26
        #       CI 用 Node 20 LTS（Vercel 对应生产 Runtime），所以钉死 npm 11（与本地 Node v25 自带的 npm 同主版本）。

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-next-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-next-

      - name: Lint
        run: npm run lint

      - name: TypeScript type check
        run: npm run typecheck

      - name: Production build
        run: npm run build
